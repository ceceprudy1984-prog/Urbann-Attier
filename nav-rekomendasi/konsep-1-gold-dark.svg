  <g transform="translate(1243 108)" fill="none" stroke="#e3c385" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h4l4 25h22l5-18H9"/><circle cx="14" cy="34" r="2"/><circle cx="30" cy="34" r="2"/></g>
  <circle cx="1284" cy="111" r="10" fill="#c8a354"/><text x="1284" y="115" text-anchor="middle" fill="#111" font-family="Arial" font-size="10" font-weight="700">2</text>
  <rect x="254" y="151" width="48" height="2" rx="1" fill="#c8a354"/>
  <text x="70" y="254" fill="#8c7651" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="2">TAMPILAN SAAT HALAMAN DIGULIR</text>
  <rect x="52" y="274" width="1336" height="70" rx="8" fill="#111111" filter="url(#shadow)"/>
  <image href="../assets/urban attier tf.png" x="78" y="282" width="96" height="54" preserveAspectRatio="xMidYMid meet"/>
  <g fill="#f1e3c4" font-family="Inter,Arial,sans-serif" font-size="14"><text x="254" y="317">Home</text><text x="320" y="317">Shop</text><text x="370" y="317">Brand</text><text x="435" y="317">Kategori</text><text x="520" y="317">Tentang Kami</text><text x="663" y="317">Kontak</text></g>
