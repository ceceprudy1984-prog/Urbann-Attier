  <g font-family="Inter,Arial,sans-serif" font-size="16" fill="#554a3a">
    <circle cx="96" cy="520" r="13" fill="#c8a354"/><text x="96" y="525" text-anchor="middle" fill="#111" font-weight="700">1</text><text x="122" y="526">Navbar mengecil dan bayangan muncul saat scroll.</text>
    <circle cx="96" cy="562" r="13" fill="#c8a354"/><text x="96" y="567" text-anchor="middle" fill="#111" font-weight="700">2</text><text x="122" y="568">Garis emas tumbuh dari kiri saat menu dipilih atau di-hover.</text>
    <circle cx="96" cy="604" r="13" fill="#c8a354"/><text x="96" y="609" text-anchor="middle" fill="#111" font-weight="700">3</text><text x="122" y="610">Menu dan ikon muncul bertahap; badge keranjang memantul saat berubah.</text>
  </g>
