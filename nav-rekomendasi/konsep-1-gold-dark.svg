<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Konsep 1 — navbar hitam dan emas</title>
  <desc id="desc">Navbar desktop premium dengan logo Urbann Attier tetap, menu, kolom pencarian, ikon akun dan keranjang. Garis menu aktif tumbuh saat hover; navbar menyusut ketika halaman digulir.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f6f1e9"/><stop offset="1" stop-color="#e9dfd1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17130f" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1440" height="720" fill="url(#bg)"/>
  <text x="64" y="47" fill="#766b5b" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="3">REKOMENDASI NAVBAR · KONSEP 01</text>
  <rect x="52" y="78" width="1336" height="100" rx="8" fill="#111111" filter="url(#shadow)"/>
  <image href="../assets/urban attier tf.png" x="78" y="96" width="108" height="64" preserveAspectRatio="xMidYMid meet"/>
  <g fill="#f1e3c4" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="500">
    <text x="254" y="137">Home</text><text x="320" y="137">Shop</text><text x="370" y="137">Brand</text><text x="435" y="137">Kategori</text><text x="520" y="137">Tentang Kami</text><text x="663" y="137">Kontak</text>
  </g>
  <rect x="844" y="108" width="310" height="42" rx="21" fill="#24211c" stroke="#6f603e"/>
  <text x="866" y="135" fill="#bdb5a8" font-family="Inter,Arial,sans-serif" font-size="13">Cari gamis atau warna...</text>
  <circle cx="1128" cy="129" r="9" fill="none" stroke="#e3c385" stroke-width="1.5"/><path d="m1135 136 6 6" stroke="#e3c385" stroke-width="1.5"/>
