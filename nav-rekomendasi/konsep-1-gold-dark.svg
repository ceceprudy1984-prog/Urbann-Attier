  <path d="M1200 365v26" stroke="#9c8351" stroke-width="1.5"/><path d="m1194 384 6 7 6-7" fill="none" stroke="#9c8351" stroke-width="1.5"/>
  <rect x="52" y="426" width="1336" height="224" rx="12" fill="#fbf9f5" stroke="#ddd2c1"/>
